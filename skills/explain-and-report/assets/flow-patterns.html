<header class="hero"><p class="eyebrow">批次校验 / 合成示例</p><h1>一批记录怎样拆开检查，再汇总验收？</h1>
<p class="lead">逐项校验回答“这一条是否合格”；整批验收使用各条结果，再检查整批要求。归档是否完成，需要另外的记录来证明。</p>
<p class="note">合成教学示例。这里假设每条记录只检查必填项，整批另有归档要求；不对应任何真实系统。</p></header>

<section class="report-section" id="overview"><h2>1. 一批包含三项，不代表三项依次执行</h2>
<figure data-figure-id="batch-structure">
<div class="figure-stage batch-map" role="group" aria-labelledby="batch-title" aria-describedby="batch-desc">
<div class="map-node map-key">
<h3 id="batch-title">批次任务：检查三条记录，并完成归档</h3>
<p class="note">下列记录属于同一批次；这里没有指定执行顺序。</p>
<ul class="contains map-row triple">
<li class="map-node"><strong>记录 A</strong><p>单独检查必填项</p></li>
<li class="map-node"><strong>记录 B</strong><p>单独检查必填项</p></li>
<li class="map-node"><strong>记录 C</strong><p>单独检查必填项</p></li>
</ul>
</div>
</div>
<figcaption id="batch-desc">图 1 · 外框表示批次包含 A、B、C。记录之间没有连线；整批归档属于批次任务，不属于任一条记录的必填项检查。</figcaption>
</figure></section>
<section class="report-section" id="inputs"><h2>2. 规则和记录共同决定单条结果</h2>
<figure data-figure-id="input-merge-decision">
<div class="figure-stage batch-map" role="group" aria-labelledby="merge-title" aria-describedby="merge-desc">
<div class="map-row">
<div class="map-node"><strong>输入 A · 当前适用规则</strong><p>定义哪些字段必填。</p></div>
<div class="map-node"><strong>输入 B · 当前记录</strong><p>提供这条记录已有的字段。</p></div>
</div>
<p class="map-arrow"><span aria-hidden="true">↓ </span>两个输入共同进入校验器</p>
<div class="map-node map-key"><h3 id="merge-title">逐项比较：必填项是否齐全？</h3></div>
<p class="map-arrow"><span aria-hidden="true">↓ </span>按判断结果分支</p>
<div class="map-row">
<div class="map-node"><strong>是 · 全部具备</strong><p>输出：此条合格</p></div>
<div class="map-node map-unknown"><strong>否 · 有缺失</strong><p>输出：此条待补充，并列出缺失项</p></div>
</div>
</div>
<figcaption id="merge-desc">图 2 · 规则给出要求，记录给出内容，校验器比较两者。规则不生成记录；两个输出是互斥分支，不是连续步骤。</figcaption>
</figure></section>
<section class="report-section" id="boundary"><h2>3. A、B、C 都通过，仍可能缺少归档证据</h2>
<figure data-figure-id="aggregation-boundary">
<div class="figure-stage batch-map" role="group" aria-labelledby="boundary-title" aria-describedby="boundary-desc">
<div class="map-row triple">
<div class="map-node"><strong>逐项检查结果</strong><p>A：通过<br>B：通过<br>C：通过</p><p class="note">只证明三条记录的必填项齐全。</p></div>
<div class="map-node"><strong>整批要求</strong><p>每条记录通过检查，并且整批已归档。</p><p class="note">这是验收条件，不是完成证据。</p></div>
<div class="map-node map-unknown"><strong>独立归档证据</strong><p>归档记录：缺失</p><p class="note">当前无法核实是否已归档。</p></div>
</div>
<p class="map-arrow"><span aria-hidden="true">↓ </span>三项输入共同进入整批验收</p>
<div class="candidate">
<h3 id="boundary-title">整批验收 · 候选职责，尚未验证</h3>
<div class="map-node map-key"><strong>每条通过，且归档记录确认已完成？</strong><p>两项都得到证据支持，才可确认整批完成。</p></div>
<p class="map-arrow"><span aria-hidden="true">↓ </span>本例：逐项通过，归档证据缺失</p>
<div class="map-node map-unknown"><strong>结果：无法确认整批完成</strong><p>待核实项：归档状态。</p></div>
</div>
</div>
<figcaption id="boundary-desc">图 3 · 逐项结果、整批要求和归档记录是三个独立输入；虚线框标出候选验收职责。A、B、C 均通过，但归档记录缺失，因此输出“归档待核实”。缺少记录也不能反推出“尚未归档”。</figcaption>
</figure></section>

<script id="report-navigation">
/* Progressive reading navigation; static links and article content work without JS. */
(function () {
  'use strict';

  function readingState({ top, bottom, viewportHeight, offset, sectionTops }) {
    const distance = bottom - top - (viewportHeight - offset);
    const atEnd = bottom <= viewportHeight + 1;
    const fraction = atEnd ? 1 : distance > 0 ? (offset - top) / distance : 0;
    const progress = Math.round(100 * Math.max(0, Math.min(1, fraction)));
    let active = -1;
    sectionTops.forEach((position, index) => {
      if (position <= offset + 1) active = index;
    });
    if (atEnd && sectionTops.length) active = sectionTops.length - 1;
    return { progress, active };
  }

  function initReadingNavigation(doc, win) {
    const report = doc.querySelector('.report');
    if (!report || report.classList.contains('navigation-ready')) return false;
    const main = report.querySelector('main#main');
    const rail = report.querySelector('.reading-rail');
    const outline = report.querySelector('details.report-outline');
    const nav = outline && outline.querySelector('nav');
    const summary = outline && outline.querySelector('summary');
    const progress = rail && rail.querySelector('[data-reading-progress]');
    const value = progress && progress.querySelector('[data-reading-value]');
    const bar = progress && progress.querySelector('[data-reading-bar]');
    if (!main || !rail || !outline || !nav || !summary || !progress || !value || !bar) return false;

    const entries = Array.from(nav.querySelectorAll('a[href^="#"]')).flatMap(link => {
      let target;
      try { target = doc.getElementById(decodeURIComponent(link.getAttribute('href').slice(1))); }
      catch (_) { return []; }
      return target && main.contains(target) ? [{ link, target }] : [];
    }).sort((a, b) => {
      const position = a.target.compareDocumentPosition(b.target);
      return position & 2 ? 1 : position & 4 ? -1 : 0;
    });
    if (!entries.length) return false;

    const wide = win.matchMedia('(min-width: 1440px)');
    let queued = false;

    function refresh() {
      // Both the sidebar and floating outline leave the top of the article clear.
      const offset = 24;
      doc.documentElement.style.setProperty('--reading-offset', `${offset}px`);
      const visible = entries.filter(entry => entry.target.getClientRects().length);
      const rect = main.getBoundingClientRect();
      const state = readingState({
        top: rect.top, bottom: rect.bottom, viewportHeight: win.innerHeight, offset,
        sectionTops: visible.map(entry => entry.target.getBoundingClientRect().top)
      });
      bar.value = state.progress;
      value.textContent = `${state.progress}%`;
      const active = visible[state.active];
      entries.forEach(entry => {
        if (entry === active) entry.link.setAttribute('aria-current', 'location');
        else entry.link.removeAttribute('aria-current');
      });
    }

    function schedule() {
      if (queued) return;
      queued = true;
      win.requestAnimationFrame(() => { queued = false; refresh(); });
    }

    function setMode() { outline.open = wide.matches; refresh(); }

    nav.addEventListener('click', event => {
      if (wide.matches || event.defaultPrevented || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey ||
          (event.button != null && event.button !== 0)) return;
      const link = event.target.closest && event.target.closest('a');
      if (entries.some(entry => entry.link === link)) {
        outline.open = false;
        // Update the scroll offset before the browser follows the ordinary hash link.
        refresh();
      }
    });
    outline.addEventListener('keydown', event => {
      if (event.key !== 'Escape' || !outline.open) return;
      outline.open = false;
      if (nav.contains(doc.activeElement)) summary.focus();
      event.preventDefault();
      refresh();
    });
    doc.addEventListener('pointerdown', event => {
      if (!wide.matches && outline.open && !rail.contains(event.target)) {
        outline.open = false;
        refresh();
      }
    });
    outline.addEventListener('toggle', schedule);
    wide.addEventListener('change', setMode);
    win.addEventListener('scroll', schedule, { passive: true });
    for (const event of ['resize', 'hashchange', 'pageshow', 'load']) win.addEventListener(event, schedule);
    if (win.ResizeObserver) {
      const observer = new win.ResizeObserver(schedule);
      observer.observe(main);
      observer.observe(rail);
    }
    if (doc.fonts) doc.fonts.ready.then(schedule);

    report.classList.add('navigation-ready');
    progress.hidden = false;
    setMode();
    schedule();
    return true;
  }

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = { readingState, initReadingNavigation };
  } else if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => initReadingNavigation(document, window), { once: true });
  } else {
    initReadingNavigation(document, window);
  }
}());
</script>
</body></html>
